name: Publish Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Get Commit SHA for Tag
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Find Build workflow run ID
        id: find_build_run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.get_sha.outputs.sha }}
        run: |
          run_id=$(gh run list --workflow "Build & Test" --commit $COMMIT_SHA --status success --json databaseId --jq 'sort_by(.databaseId) | .[-1].databaseId // ""' )
          if [ -z "$run_id" ]; then
            echo "No successful build run found for commit ${{ steps.get_sha.outputs.sha }}"
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

      - name: Download NuGet artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find_build_run.outputs.run_id }}
        run: |
          gh run download $RUN_ID --name nuget-packages --dir ./nupkgs
          gh run download $RUN_ID --name nuget-tool-package --dir ./nupkgtool

      - name: Publish NuGet packages to GitHub Packages
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done
          for pkg in ./nupkgtool/*.nupkg; do
            dotnet nuget push "$pkg" --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done

  release-aot-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Get Commit SHA for Tag
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Find Build Native AOT workflow run ID
        id: find_aot_run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.get_sha.outputs.sha }}
        run: |
          run_id=$(gh run list --workflow "Build Native AOT Binaries" --commit $COMMIT_SHA --status success --json databaseId --jq 'sort_by(.databaseId) | .[-1].databaseId // ""' )
          if [ -z "$run_id" ]; then
            echo "No successful AOT build run found for commit ${{ steps.get_sha.outputs.sha }}"
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

      - name: Download all native binary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find_aot_run.outputs.run_id }}
        run: |
          mkdir -p ./all-artifacts
          gh run download $RUN_ID --pattern "native-binary-*" --dir ./all-artifacts
          if [ -z "$(ls -A ./all-artifacts)" ]; then echo "No native binary artifacts found for run $RUN_ID"; exit 1; fi

      - name: Upload native binaries to Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ./all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
