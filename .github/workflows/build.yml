name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dagger Build
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          call: build 
          
      - name: Dagger Test
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          call: test

      - name: Dagger Pack NuGet
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          call: pack --output nupkgs

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg

      - name: Dagger Pack .NET Tool
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          call: tool --repo-dir=./ --output nupkgtool

      - name: Upload .NET Tool package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-tool-package
          path: nupkgtool/*.nupkg